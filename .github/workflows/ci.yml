name: C++ reconstruction correctness
on: [push, pull_request]
jobs:
  a0:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install numpy cmake ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test A0 inference and A1 geometry, feasibility and support queries
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }} --parallel 2
      - name: Record acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-and-a1-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/a0_acceptance.json
            build/${{ matrix.preset }}/oracle/metadata.json
            build/${{ matrix.preset }}/oracle_a1/metadata.json
            build/${{ matrix.preset }}/oracle_a1/propagation_metadata.json
            build/${{ matrix.preset }}/oracle_a1/feasibility_metadata.json
            build/${{ matrix.preset }}/oracle_a1/support_query_metadata.json
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
