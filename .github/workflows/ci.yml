name: C++ reconstruction checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake ninja
      - name: Configure focused development checks
        run: cmake -S . -B build/focused -G Ninja -DCMAKE_BUILD_TYPE=Release -DMCR_ENABLE_PYTHON_ORACLE=OFF
      - name: Build focused targets
        run: cmake --build build/focused --parallel 2 --target a2_geometry_tests a2_inference_tests geometry_tests a1_geometry_tests constraint_tests a1_constraint_tests inference_tests adversarial_tests
      - name: Run focused A2 checks and A0/A1 regressions
        run: ctest --test-dir build/focused --output-on-failure -R '^(a2_geometry_tests|a2_inference_tests|geometry_tests|a1_geometry_tests|constraint_tests|a1_constraint_tests|inference_tests|adversarial_tests)$'
  full:
    # Deliberate milestone gate; ordinary development pushes use focused checks.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install numpy cmake ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test complete A0 and A1 correctness gates
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }} --parallel 2
      - name: Record acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-and-a1-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/a0_acceptance.json
            build/${{ matrix.preset }}/a1_acceptance.json
            build/${{ matrix.preset }}/oracle/metadata.json
            build/${{ matrix.preset }}/oracle_a1/metadata.json
            build/${{ matrix.preset }}/oracle_a1/acceptance_metadata.json
            build/${{ matrix.preset }}/oracle_a1/propagation_metadata.json
            build/${{ matrix.preset }}/oracle_a1/feasibility_metadata.json
            build/${{ matrix.preset }}/oracle_a1/support_query_metadata.json
            build/${{ matrix.preset }}/oracle_a1/projection_metadata.json
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
